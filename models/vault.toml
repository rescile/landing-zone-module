origin_resource = "record"

provider_name = { "function!" = "{{- origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower -}}" }
provider = { "json!" = "{{- provider_name -}}.json" }

[[create_resource]]
match_on = [ { property = "function", value = "vault" } ]
resource_type = "vault"
relation_type = "SATISFIES"
name = "{{ origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower }}-{{- params.solution | lower -}}-{{- provider.dictionary.vault -}}"
[create_resource.properties]
function = "encryption"
provider = "{{- provider_name | lower -}}"
wallet = ["{{- params.solution -}}"]
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

origin_resource = "vault"

[[link_resources]]
with = "subscription"
join = { local = "provider", remote = "provider" }
create_relation = { type = "SATISFIES" }
copy_properties = [
  { from = "portfolio", as = "keys" }
]
