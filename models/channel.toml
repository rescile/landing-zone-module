origin_resource = "login"

[[create_resource]]
create_from = { property = "channel" }
relation_type = "DERIVED_FROM"
name = "{{ origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower }}-{{ property.value | lower }}-channel"
[create_resource.properties]
function = "{{- params.solution -}}"
description = "The {{ property.value | lower }} channel enables communication for operators."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
