origin_resource = "account"

provider_name = { "function!" = "{{- origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower -}}" }
provider = { "json!" = "{{- provider_name -}}.json" }
locations = { "json!" = "location_codes.json" }

[[create_resource]]
create_from = { property = "home", as = "region" }
relation_type = "DEFINED_BY"
name = "{{ origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower }}-{{- property.value | lower -}}"
[create_resource.properties]
function = "{{- origin_resource.function | lower -}}"
location = "{{- property.value | lower -}}"
code = "{{- locations[property.value].iata  | upper -}}"
timezone = "{{- locations[property.value].tz -}}"
country = "{{- locations[property.value].country | upper -}}"
provider = "{{- provider_name -}}"
description = "The home location {{ property.value | capitalize }} refers to the physical data center of a provider where management applications are hosted and data is stored, protected by privacy laws of the resident."
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

