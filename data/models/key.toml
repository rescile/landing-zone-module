origin_resource = "vault"

[[create_resource]]
resource_type = "key"
relation_type = "PROTECTED_BY"
name = "{{ origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower }}-master-key"
[create_resource.properties]
function = "master"
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"

origin_resource = "wallet"
provider_name = { "template!" = "{{- origin_resource.name | regexp(expr='s/^([^-]+)-.*/\\1/') | lower -}}" }

[[create_resource]]
create_from = { property = "key" }
relation_type = "DEFINED_BY"
name = "{{ origin_resource.name | regexp(expr='s/^([^-]+-[^-]+)-.*/\\1/') | lower }}-key"
[create_resource.properties]
function = "service"
provider = "{{- provider_name | lower -}}"
created = "{{- now(utc=true) | date(format='%Y-%m-%dT%H:%M:%SZ') -}}"
