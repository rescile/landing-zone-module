origin_resource = "subuscription"

[[output]]
resource_type = "aws_tf_output"
name = "{{ origin_resource.name }}"
filename = "{{ origin_resource.name }}-output.tf.json"
mimetype = "application/json"
template = """
{
  "output": {
    "vpc_id": {
      "description": "ID of the dedicated Salesforce connectivity VPC.",
      "value": "${aws_vpc.salesforce.id}"
    },
    "private_subnet_ids": {
      "description": "IDs of the private subnets hosting the interface endpoint.",
      "value": "${aws_subnet.private[*].id}"
    },
    "endpoint_id": {
      "description": "ID of the Salesforce interface VPC endpoint.",
      "value": "${aws_vpc_endpoint.salesforce.id}"
    },
    "endpoint_state": {
      "description": "Current state reported by AWS for the interface endpoint.",
      "value": "${aws_vpc_endpoint.salesforce.state}"
    },
    "endpoint_dns_entries": {
      "description": "DNS entries AWS exposes for the interface endpoint.",
      "value": "${aws_vpc_endpoint.salesforce.dns_entry}"
    },
    "endpoint_network_interface_ids": {
      "description": "Network interface IDs created for the interface endpoint.",
      "value": "${aws_vpc_endpoint.salesforce.network_interface_ids}"
    }
  }
}
"""
