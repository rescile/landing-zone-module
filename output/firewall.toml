origin_resource = "firewall"

[[output]]
resource_type = "aws_tf_output"
name = "{{ origin_resource.name }}"
filename = "{{ origin_resource.name }}.tf.json"
mimetype = "application/json"
template = """
{
    "data": {
        "aws_vpc": {
        "parent": {
            "filter": [
            {
                "name": "tag:Name",
                "values": ["{{- origin_resource.network[0].name -}}"]
            }
            ]
        }
    }
},
{
  "resource": {
    "aws_security_group": {
      "endpoint": {
        "name": "${var.name_prefix}-endpoint-sg",
        "description": "Allow approved VPC clients to reach the Salesforce PrivateLink endpoint on HTTPS.",
        "vpc_id": "${data.aws_vpc.parent.id}",
        "ingress": [
          {
            "description": "HTTPS from approved client CIDRs",
            "protocol": "tcp",
            "from_port": 443,
            "to_port": 443,
            "cidr_blocks": "${var.allowed_client_cidrs}"
          }
        ],
        "egress": [],
        "tags": {
            "solution": "{{- params.solution -}}",
            "tenant": "{{- params.tenant -}}"
        }
      }
    }
  }
}
"""
