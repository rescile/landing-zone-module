origin_resource = "network"

[[output]]
resource_type = "aws_network"
name = "{{ origin_resource.name }}"
filename = "{{ origin_resource.name }}.tf.json"
mimetype = "application/json"
template = """
{
  "resource": {
    "aws_vpc": {
      "salesforce": {
        "cidr_block": "${var.vpc_cidr}",
        "enable_dns_support": true,
        "enable_dns_hostnames": true,
        "tags": "${merge(var.common_tags, { Name = \"${var.name_prefix}-vpc\" })}"
      }
    }
  }
}
"""
