origin_resource = "subuscription"

[[output]]
resource_type = "aws_provider"
name = "{{ origin_resource.name }}"
filename = "{{ origin_resource.name }}-provider.tf.json"
mimetype = "application/json"
template = """
{
  "terraform": {
    "required_version": ">= 1.5.0",
    "required_providers": {
      "aws": {
        "source": "hashicorp/aws",
        "version": ">= 5.0, < 7.0"
      }
    }
  },
  "provider": {
    "aws": {
      "region": "${var.aws_region}"
    }
  }
}
"""
