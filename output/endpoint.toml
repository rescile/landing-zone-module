origin_resource = "enpoint"

[[output]]
resource_type = "aws_tf_output"
name = "{{ origin_resource.name }}"
filename = "{{ origin_resource.name }}.tf.json"
mimetype = "application/json"
template = """
{
    "data": {
        "aws_vpc": {
        "parent": {
            "filter": [
            {
                "name": "tag:Name",
                "values": ["{{- origin_resource.network[0].name -}}"]
            }
            ]
        }
    }
},
{
  "resource": {
    "aws_vpc_endpoint": {
      "salesforce": {
        "vpc_id": "${data.aws_vpc.parent.id}",
        "service_name": "{{- origin_resource.network.name -}}",
        "vpc_endpoint_type": "Interface",
        "subnet_ids": "${aws_subnet.private[*].id}",
        "security_group_ids": [
          "${aws_security_group.endpoint.id}"
        ],
        "private_dns_enabled": "${var.endpoint_private_dns_enabled}",
        "tags": {
            "solution": "{{- params.solution -}}",
            "tenant": "{{- params.tenant -}}"
        }
      }
    }
  }
}
"""
