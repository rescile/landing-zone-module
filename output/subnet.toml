origin_resource = "subnet"

[[output]]
resource_type = "aws_subnet"
name = "{{ origin_resource.name }}"
filename = "{{ origin_resource.name }}.tf.json"
mimetype = "application/json"
template = """
{
  "data": {
    "aws_availability_zones": {
      "available": {
        "state": "available"
      }
    }
  },
  "locals": {
    "endpoint_azs": "${slice(data.aws_availability_zones.available.names, 0, 2)}"
  },
  "resource": {
    "aws_subnet": {
      "private": {
        "count": 2,
        "vpc_id": "${aws_vpc.salesforce.id}",
        "cidr_block": "${var.private_subnet_cidrs[count.index]}",
        "availability_zone": "${local.endpoint_azs[count.index]}",
        "map_public_ip_on_launch": false,
        "tags": {
            "solution": "{{- params.solution -}}",
            "tenant": "{{- params.tenant -}}"
        }
      }
    }
  }
}
"""
